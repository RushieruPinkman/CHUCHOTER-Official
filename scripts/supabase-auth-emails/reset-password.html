<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>CHUCHOTER</title>
</head>
<body style="margin:0;padding:0;background-color:#060605;font-family:Georgia,'Times New Roman','Hiragino Mincho ProN','Yu Mincho',serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#060605;background:linear-gradient(180deg,#060605 0%,#0a0908 45%,#060605 100%);">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <p style="margin:0;font-size:11px;letter-spacing:0.35em;color:#7a6640;text-transform:uppercase;">Private Members</p>
              <h1 style="margin:8px 0 0;font-size:28px;font-weight:400;letter-spacing:0.18em;color:#c9a962;">CHUCHOTER</h1>
              <p style="margin:10px 0 0;font-size:12px;color:#9c9890;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;">あなたに最高の癒しを。</p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#131211;border:1px solid rgba(201,169,98,0.22);border-radius:2px;padding:32px 28px;">
              <p style="margin:0 0 8px;font-size:11px;letter-spacing:0.2em;color:#7a6640;text-transform:uppercase;">Reset</p>
              <h2 style="margin:0 0 18px;font-size:20px;font-weight:400;color:#eae6df;font-family:'Hiragino Mincho ProN','Yu Mincho',Georgia,serif;">パスワード再設定</h2>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.8;color:#9c9890;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;">
                パスワード再設定のリクエストを受け付けました。<br />
                下のボタンから新しいパスワードを設定してください。リンクの有効期限は限られています。
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 auto 24px;">
                <tr>
                  <td align="center" style="background-color:#c9a962;border-radius:2px;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 32px;font-size:13px;letter-spacing:0.12em;color:#060605;text-decoration:none;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;font-weight:700;">
                      パスワードを再設定
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 12px;font-size:12px;line-height:1.7;color:#6e6a63;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;">
                ボタンが押せない場合は、以下の URL をブラウザに貼り付けてください。
              </p>
              <p style="margin:0;word-break:break-all;font-size:11px;line-height:1.6;color:#7a6640;font-family:monospace;">
                {{ .ConfirmationURL }}
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0 0 6px;font-size:11px;line-height:1.6;color:#6e6a63;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;">
                心当たりがない場合は、このメールを破棄してください。
              </p>
              <p style="margin:0;font-size:11px;color:#6e6a63;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;">
                © CHUCHOTER · {{ .SiteURL }}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
