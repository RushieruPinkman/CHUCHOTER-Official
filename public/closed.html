<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CHUCHOTER — サイト閉鎖のお知らせ</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f0e0c;
        --muted: #b7aea0;
        --gold: #c9a962;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        background:
          radial-gradient(ellipse at top, rgba(201, 169, 98, 0.12), transparent 55%),
          var(--bg);
        color: #f2ebe0;
      }
      main {
        max-width: 36rem;
        text-align: center;
      }
      p.en {
        margin: 0 0 0.75rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: var(--gold);
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 1.25rem;
        font-weight: 500;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.8;
        color: #b7aea0;
        font-size: 0.98rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="en">Notice</p>
      <h1>CHUCHOTER 公式サイトは<br />閉鎖いたしました</h1>
      <p>
        これまでご利用・ご声援いただき、誠にありがとうございました。<br />
        本サイトおよび関連サービスはすべて終了しております。
      </p>
    </main>
  </body>
</html>
